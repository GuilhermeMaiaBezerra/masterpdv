<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MasterPDV - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../../css/home.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-container">
    <!-- MENU LATERAL (SIDEBAR) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>MasterPDV</h1>
            <div class="tag">Painel Administrativo</div>
        </div>
        <div class="nav-menu">
            <a class="nav-item active" data-page="inicio" href="/home">
                <i class="fas fa-home"></i>
                <span>Início</span>
            </a>
            <a class="nav-item" data-page="vendas" href="vendas">
                <i class="fas fa-shopping-cart"></i>
                <span>Vendas</span>
            </a>
            <a class="nav-item" data-page="produtos" href="produtos">
                <i class="fas fa-building"></i>
                <span>Produtos</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="logout-mobile" id="sidebarLogoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Saír</span>
            </div>
            <div class="copyright">
                MasterPDV - MasterPDV © 2026<br>Todos os direitos reservados.
            </div>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <div class="top-bar">
            <div class="greeting">
                <h2>Seja bem vindo!</h2>
            </div>
        </div>

        <div class="dashboard-content" id="dynamicContent">
            <div class="info-section" id="mainPanel">
                <div class="section-title">
                    <i class="fas fa-tac    hometer-alt"></i>
                    <h2>Dashboard</h2>
                </div>
                <div class="grid-placeholder">
                    <!-- CARD FATURAMENTO -->
                    <div class="card-info">
                        <h4><i class="fas fa-chart-simple"></i> Faturamento (Mês)</h4>
                        <p>Carregando...</p>
                        <div style="font-size: 0.75rem; margin-top: 14px; opacity: 0.75; display: flex; gap: 12px; align-items: center;">
                            <span><i class="fas fa-spinner fa-spin"></i> Carregando...</span>
                        </div>
                    </div>
                    <!-- CARD VENDAS -->
                    <div class="card-info">
                        <h4><i class="fas fa-file-invoice-dollar"></i> Total de Vendas (Mês)</h4>
                        <p>Carregando...</p>
                        <div style="font-size: 0.75rem; margin-top: 14px; opacity: 0.75;">
                            <i class="fas fa-calendar-alt"></i> Este mês
                        </div>
                    </div>
                    <!-- CARD PRODUTOS --> 
                    <div class="card-info">
                        <h4><i class="fas fa-boxes"></i> Produtos Ativos</h4>
                        <p>Carregando...</p>
                        <div style="font-size: 0.75rem; margin-top: 14px; opacity: 0.75;">
                            <i class="fas fa-box"></i> em estoque
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>


<script>
document.addEventListener("DOMContentLoaded", function() {
    let graficoPizza = null;
    let graficoLinha = null;

function confirmarLogout() {
    if (confirm("Deseja realmente sair do sistema?")) {
       
        window.location.href = "/logout";
        
    }
}
    document.getElementById("sidebarLogoutBtn").addEventListener("click", confirmarLogout);

function carregarDashboard() {
    console.log("Carregando dashboard com dados REAIS...");
    fetch('/api/dashboard-data')  // VOLTOU PARA O ENDPOINT REAL
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log("Dados recebidos:", data);
            if (data.success) {
                atualizarCards(data.dashboard);
                criarGraficoPizza(data.grafico_pagamentos);
                criarGraficoLinha(data.vendas_semana);
                atualizarTopProdutos(data.top_produtos);
            } else {
                console.error('Erro ao carregar dados:', data.error);
            }
        })
        .catch(error => {
            console.error('Erro na requisição:', error);
        });
}
    function atualizarCards(dados) {
        // Atualizar cards existentes
        const cards = document.querySelectorAll('.card-info');
        if (cards.length >= 3) {
            // Card Faturamento
            cards[0].querySelector('p').innerHTML = `R$ ${dados.faturamento}`;
            const crescimentoSpan = cards[0].querySelector('.fa-arrow-up, .fa-arrow-down')?.parentElement;
            if (crescimentoSpan && dados.crescimento !== undefined) {
                const sinal = dados.crescimento >= 0 ? '+' : '';
                const seta = dados.crescimento >= 0 ? 'up' : 'down';
                crescimentoSpan.innerHTML = `<i class="fas fa-arrow-${seta}"></i> ${sinal}${dados.crescimento}%`;
            }
            
            // Card Vendas
            cards[1].querySelector('p').innerHTML = dados.vendas;
            
            // Card Produtos
            cards[2].querySelector('p').innerHTML = dados.produtos;
        }
    }

    function criarGraficoPizza(dados) {
        const mainPanel = document.getElementById('mainPanel');
        let canvas = document.getElementById('graficoPizza');
        
        // Se o canvas não existe, criar a estrutura dos gráficos
        if (!canvas) {
            const graficosHTML = `
                <div class="graficos-container">
                    <div class="grafico-box">
                        <div class="section-title">
                            <i class="fas fa-chart-pie"></i>
                            <h3>Vendas por Forma de Pagamento</h3>
                        </div>
                        <div class="grafico-wrapper">
                            <canvas id="graficoPizza" width="400" height="400"></canvas>
                        </div>
                    </div>
                    <div class="grafico-box">
                        <div class="section-title">
                            <i class="fas fa-chart-line"></i>
                            <h3>Faturamento Últimos 7 Dias</h3>
                        </div>
                        <div class="grafico-wrapper">
                            <canvas id="graficoLinha" width="400" height="400"></canvas>
                        </div>
                    </div>
                </div>
                <div class="top-produtos-container">
                    <div class="section-title">
                        <i class="fas fa-trophy"></i>
                        <h3>Produtos Mais Vendidos (Mês)</h3>
                    </div>
                    <div class="top-produtos">
                        <div class="loading">Carregando produtos...</div>
                    </div>
                </div>
            `;
            
            mainPanel.insertAdjacentHTML('beforeend', graficosHTML);
            canvas = document.getElementById('graficoPizza');
        }

        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        
        // Destruir gráfico existente se houver
        if (graficoPizza) {
            graficoPizza.destroy();
        }

        if (dados.length === 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "16px Inter";
            ctx.fillStyle = "#999";
            ctx.textAlign = "center";
            ctx.fillText("Nenhuma venda registrada este mês", canvas.width/2, canvas.height/2);
            return;
        }

        const labels = dados.map(item => `${item.forma} (${item.quantidade} vendas)`);
        const valores = dados.map(item => item.total);
        const cores = dados.map(item => item.cor);

        graficoPizza = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{
                    data: valores,
                    backgroundColor: cores,
                    borderWidth: 2,
                    borderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: {
                                size: 12
                            },
                            padding: 10
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw;
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentagem = ((value / total) * 100).toFixed(1);
                                return `${label}: R$ ${value.toLocaleString('pt-BR')} (${percentagem}%)`;
                            }
                        }
                    }
                }
            }
        });
    }

    function criarGraficoLinha(dados) {
        const canvas = document.getElementById('graficoLinha');
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        
        if (graficoLinha) {
            graficoLinha.destroy();
        }

        if (dados.length === 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "16px Inter";
            ctx.fillStyle = "#999";
            ctx.textAlign = "center";
            ctx.fillText("Nenhuma venda registrada esta semana", canvas.width/2, canvas.height/2);
            return;
        }

        const dias = dados.map(item => item.data);
        const totais = dados.map(item => item.total);

        graficoLinha = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dias,
                datasets: [{
                    label: 'Faturamento (R$)',
                    data: totais,
                    borderColor: '#FF6384',
                    backgroundColor: 'rgba(255, 99, 132, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#FF6384',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 7
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `Faturamento: R$ ${context.raw.toLocaleString('pt-BR')}`;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return 'R$ ' + value.toLocaleString('pt-BR');
                            }
                        }
                    }
                }
            }
        });
    }

    function atualizarTopProdutos(produtos) {
        let container = document.querySelector('.top-produtos');
        if (!container) return;

        if (produtos.length === 0) {
            container.innerHTML = '<div class="no-data">Nenhum produto vendido este mês</div>';
            return;
        }

        let html = '<div class="top-produtos-list">';
        produtos.forEach((produto, index) => {
            html += `
                <div class="produto-item">
                    <div class="produto-rank">${index + 1}º</div>
                    <div class="produto-info">
                        <div class="produto-nome">${produto.nome}</div>
                        <div class="produto-stats">
                            <span><i class="fas fa-box"></i> ${produto.quantidade} unidades</span>
                            <span><i class="fas fa-dollar-sign"></i> R$ ${produto.faturamento.toLocaleString('pt-BR')}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;
    }

    // Inicializar dashboard
    carregarDashboard();
    
    // Recarregar dados a cada 5 minutos
    setInterval(carregarDashboard, 300000);
});
</script>

</body>
</html>
